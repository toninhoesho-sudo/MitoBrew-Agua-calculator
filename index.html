<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><link rel="manifest" href="manifest.json"><title>MitoBrew</title><style>
:root{--n:#123b63;--b:#2476b8;--p:#eef6fc;--ink:#183047;--line:#d6e2ec}*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:var(--ink);font-family:system-ui,Arial,sans-serif}header{background:linear-gradient(135deg,var(--n),var(--b));color:white;padding:24px 18px;border-radius:0 0 22px 22px}h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#e0effb}main{max-width:650px;margin:auto;padding:15px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:14px}h2{font-size:18px;margin:0 0 12px;color:var(--n)}label{display:block;font-size:13px;font-weight:700;margin:11px 0 5px;color:#41596d}input,textarea{width:100%;padding:12px;border:1px solid #c7d7e4;border-radius:10px;font:inherit;background:#fbfdff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:11px;padding:12px;font:inherit;font-weight:700;background:var(--p);color:var(--n)}.primary{background:var(--n);color:white;width:100%;margin-top:14px}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}.small{font-size:12px;color:#617487;line-height:1.45}.entry{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}.entry p{margin:5px 0}.pill{font-size:12px;background:#e8f3fc;padding:5px 9px;border-radius:20px}.empty{color:#617487;text-align:center;padding:18px;background:#f7fafc;border-radius:10px}footer{text-align:center;font-size:12px;color:#617487;padding:8px 15px 25px}
</style></head><body><header><h1>🍺 MitoBrew</h1><p>Diario de fermentación · Cervecero Tony</p></header><main>
<section class="card"><h2>Lote activo</h2><label for="batchName">Nombre de la cerveza / lote</label><input id="batchName" placeholder="Ej. Winter Navideña 2026" maxlength="80"><div class="grid"><div><label for="startDate">Fecha de inicio</label><input id="startDate" type="date"></div><div><label for="batchNotes">Notas del lote</label><input id="batchNotes" placeholder="Levadura, etc." maxlength="160"></div></div><div class="row"><button id="saveBatch">Guardar lote</button><button id="newBatch">Nuevo lote</button></div><p class="small">Los datos se guardan en este móvil y navegador. Exporta el historial periódicamente como copia de seguridad.</p></section>
<section class="card"><h2>Nueva medición</h2><div class="grid"><div><label for="density">Densidad (SG)</label><input id="density" inputmode="decimal" placeholder="1.012"></div><div><label for="temp">Temperatura (°C)</label><input id="temp" inputmode="decimal" placeholder="18.5"></div><div><label for="measureDate">Fecha</label><input id="measureDate" type="date"></div><div><label for="measureTime">Hora</label><input id="measureTime" type="time"></div></div><label for="measureNotes">Observaciones (opcional)</label><textarea id="measureNotes" rows="2" placeholder="Actividad, presión, aroma…" maxlength="300"></textarea><button class="primary" id="addMeasurement">Guardar medición</button></section>
<section class="card"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><h2 style="margin:0">Historial del lote</h2><span id="count" class="pill">0 mediciones</span></div><div id="history" class="empty" style="margin-top:12px">Todavía no hay mediciones.</div><div class="row"><button id="exportCsv">Exportar CSV</button><button id="showAll">Todos los lotes</button></div><div id="allBatches" hidden></div></section></main><footer>MitoBrew · Medición a medición.</footer>
<script>
const KEY='mitobrew_data_v1', $=id=>document.getElementById(id);const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},nowTime=()=>{let d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};let db=JSON.parse(localStorage.getItem(KEY)||'{"batches":[],"activeId":null}');function save(){localStorage.setItem(KEY,JSON.stringify(db))}function active(){return db.batches.find(b=>b.id===db.activeId)}function fresh(){return{id:String(Date.now()),name:'Nuevo lote',startDate:today(),notes:'',measurements:[]}}function ensure(){if(!active()){let b=fresh();db.batches.unshift(b);db.activeId=b.id;save()}return active()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){let b=active();$('batchName').value=b?.name||'';$('startDate').value=b?.startDate||today();$('batchNotes').value=b?.notes||'';render()}function render(){let b=active(),h=$('history');$('count').textContent=(b?.measurements.length||0)+' mediciones';if(!b||!b.measurements.length){h.className='empty';h.textContent='Todavía no hay mediciones.';return}h.className='';h.innerHTML=[...b.measurements].reverse().map(m=>`<div class="entry"><span class="small">${esc(m.date)} · ${esc(m.time)}</span><p><b>Densidad:</b> ${esc(m.density)} &nbsp; <b>Temperatura:</b> ${esc(m.temp)} °C</p>${m.notes?`<p>${esc(m.notes)}</p>`:''}<button data-del="${m.id}" style="margin-top:5px">Eliminar</button></div>`).join('');h.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{if(confirm('¿Eliminar esta medición?')){let b=active();b.measurements=b.measurements.filter(m=>m.id!==x.dataset.del);save();render()}})}$('measureDate').value=today();$('measureTime').value=nowTime();if(!active()){let b=fresh();db.batches.unshift(b);db.activeId=b.id;save()}load();$('saveBatch').onclick=()=>{let b=ensure();b.name=$('batchName').value.trim()||'Lote sin nombre';b.startDate=$('startDate').value||today();b.notes=$('batchNotes').value.trim();save();load();alert('Lote guardado')};$('newBatch').onclick=()=>{if(!confirm('¿Crear lote nuevo? El actual quedará guardado.'))return;let b=fresh();db.batches.unshift(b);db.activeId=b.id;save();load()};$('addMeasurement').onclick=()=>{let density=$('density').value.trim().replace(',','.'),temp=$('temp').value.trim().replace(',','.');if(!density||!temp||!Number.isFinite(+density)||!Number.isFinite(+temp)){alert('Introduce densidad y temperatura válidas.');return}let b=ensure();b.name=$('batchName').value.trim()||b.name;b.startDate=$('startDate').value||b.startDate;b.notes=$('batchNotes').value.trim();b.measurements.push({id:String(Date.now()),date:$('measureDate').value||today(),time:$('measureTime').value||nowTime(),density,temp,notes:$('measureNotes').value.trim()});save();$('density').value='';$('temp').value='';$('measureNotes').value='';$('measureDate').value=today();$('measureTime').value=nowTime();render();alert('Medición guardada')};$('exportCsv').onclick=()=>{let b=active();if(!b||!b.measurements.length){alert('No hay mediciones para exportar.');return}let rows=[['Lote',b.name],['Inicio',b.startDate],[],['Fecha','Hora','Densidad SG','Temperatura C','Observaciones'],...b.measurements.map(m=>[m.date,m.time,m.density,m.temp,m.notes])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=(b.name||'mitobrew').replace(/[^a-z0-9_-]/gi,'_')+'.csv';a.click();URL.revokeObjectURL(a.href)};$('showAll').onclick=()=>{let el=$('allBatches');el.hidden=!el.hidden;if(!el.hidden){el.innerHTML=db.batches.map(b=>`<div class="entry"><b>${esc(b.name)}</b><p class="small">Inicio: ${esc(b.startDate)} · ${b.measurements.length} mediciones</p><button data-open="${b.id}">Abrir lote</button></div>`).join('')||'No hay lotes.';el.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{db.activeId=x.dataset.open;save();load();el.hidden=true;window.scrollTo(0,0)})}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
